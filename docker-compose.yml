services:

  agent-spec2doc:
    build: ./agent-spec2doc
    ports:
      - "8001:8001"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  agent-figma:
    build: ./agent-figma
    ports:
      - "8002:8002"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  agent-transcribe:
    build: ./agent-transcribe
    ports:
      - "8003:8003"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  agent-release-notes:
    build: ./agent-release-notes
    ports:
      - "8004:8004"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  agent-api-docs:
    build: ./agent-api-docs
    ports:
      - "8005:8005"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  agent-reviewer:
    build: ./agent-reviewer
    ports:
      - "8006:8006"
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      - ./openclaw/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./openclaw/workspace:/home/node/.openclaw/workspace-orchestrator
    env_file: .env
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - agent-spec2doc
      - agent-figma
      - agent-transcribe
      - agent-release-notes
      - agent-api-docs
      - agent-reviewer

networks:
  agent-network:
    driver: bridge
