services:
  hermes-discord:
    build: ./hermes
    volumes:
      - ./hermes/state:/app/state
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_GUILD_IDS: ${DISCORD_ALLOWED_GUILD_IDS:-}
      DISCORD_ALLOWED_CHANNEL_IDS: ${DISCORD_ALLOWED_CHANNEL_IDS:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      HERMES_STATE_DIR: /app/state
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-moonshotai/kimi-k2.6}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      HERMES_VISION_MODEL: ${HERMES_VISION_MODEL:-google/gemini-2.5-flash}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      FIGMA_TOKEN: ${FIGMA_TOKEN:-}
      FIGMA_API_BASE: ${FIGMA_API_BASE:-https://api.figma.com/v1}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
