id: techwriter-super-agent
name: Techwriter Super Agent
description: >
  Self-hosted Discord-ассистент технического писателя: черновики инструкций
  из постановок и merge request'ов GitLab, документация по API, release notes
  и changelog из GitHub/Jira, руководства по интерфейсам из Figma и скриншотов.
  Включает Postgres-телеметрию и дашборд аналитики.
owner: personal

runtimes:
  hermes:
    supported: true
    docs: runtimes/hermes/README.md
    install:
      linux: runtimes/hermes/install.sh
      windows: runtimes/hermes/install.ps1
    skills:
      required:
        - spec2doc
        - api-docs
        - release-notes
        - figma-guide
      optional: []

integrations:
  required:
    - discord
    - openrouter
    - postgres
  optional:
    - github
    - gitlab
    - jira
    - figma

secrets:
  required:
    - DISCORD_BOT_TOKEN
    - OPENROUTER_API_KEY
    - POSTGRES_PASSWORD
  optional:
    - GITHUB_TOKEN
    - GITLAB_TOKEN
    - JIRA_EMAIL
    - JIRA_API_TOKEN
    - FIGMA_TOKEN
